<!doctype html>
<!--
  multicam_viewer.html — 3-camera WebRTC (WHEP) viewer for Marvin, with live stats.
  Open http://100.93.121.3:8090/ in Chrome on the sim chair — start_all.sh
  serves this page from the Jetson. Do NOT double-click the file: a file://
  page sends "Origin: null", which MediaMTX's CORS doesn't allow, so every
  WHEP request fails with "Failed to fetch".

  Keep this as the ONLY viewer: every extra tab or MediaMTX page doubles the
  cellular upload and was what clogged the link on 2026-10-10.

  Auto-cutoff: if the front camera's RTT stays > 2 s or its frames stall for
  6 s in a row, all streams are closed so the drive commands get the uplink
  back (a 1.8 Mbps run recovered ~12 s after the cutoff instead of ~4 min).
  Press Reconnect to try again.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvin cameras</title>
<style>
  :root { --bg: #000; --fg: #0f0; --warn: #fc3; --bad: #f44; --bar: #000b; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px monospace; }
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9; background: var(--bar);
         padding: 4px 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #bar input { width: 120px; font: inherit; }
  #bar button { font: inherit; }
  #status.bad { color: var(--bad); }
  #grid { display: flex; height: 100vh; gap: 2px; }
  .cam { position: relative; flex: 1; }
  .cam.front { flex: 1.4; }
  .cam video { width: 100%; height: 100%; object-fit: contain; background: var(--bg); }
  .hud { position: absolute; bottom: 0; left: 0; background: var(--bar); padding: 3px; }
  .hud.warn { color: var(--warn); }
  /* ?clock=1: glass-to-glass test. Point the front ZED at this clock; a screenshot
     then holds the live clock and the camera's delayed copy of it. */
  #g2g { position: fixed; z-index: 10; left: 50%; bottom: 4vh; transform: translateX(-50%);
         background: #fff; color: #000; font: bold 11vh monospace; padding: 0 2vh;
         letter-spacing: 0.05em; display: none; }
</style>
</head>
<body>
<div id="bar">
  <span>Jetson</span><input id="host" value="100.93.121.3">
  <button id="connect">Reconnect</button>
  <button id="save">Save stats</button>
  <span id="status">starting…</span>
</div>
<div id="grid">
  <div class="cam"><video id="v_zed_left" autoplay muted playsinline></video><div class="hud" id="h_zed_left">zed_left</div></div>
  <div class="cam front"><video id="v_zed_front" autoplay muted playsinline></video><div class="hud" id="h_zed_front">zed_front</div></div>
  <div class="cam"><video id="v_zed_right" autoplay muted playsinline></video><div class="hud" id="h_zed_right">zed_right</div></div>
</div>
<div id="g2g"></div>
<script>
// Front first, then sides 4 s apart (matches start_all.sh staggering).
const CAMS = ['zed_front', 'zed_left', 'zed_right'];
let run = null;

function setStatus(text, bad) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = bad ? 'bad' : '';
}

function stop() {
  if (!run) return;
  run.stopped = true;  // also aborts a connect loop still in progress
  clearInterval(run.timer);
  Object.values(run.cams).forEach(c => c.pc.close());
}

async function connectCam(host, cam) {
  const pc = new RTCPeerConnection();
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.ontrack = e => { document.getElementById('v_' + cam).srcObject = e.streams[0]; };
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise(r => {
    if (pc.iceGatheringState === 'complete') r();
    pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r();
    setTimeout(r, 2000);
  });
  const res = await fetch(`http://${host}:8889/${cam}/whep`, {
    method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp });
  if (!res.ok) throw new Error(`${cam}: WHEP ${res.status}`);
  await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
  return { pc, samples: [] };
}

async function sample() {
  const t = (performance.now() - run.t0) / 1000;
  for (const cam of CAMS) {
    const c = run.cams[cam];
    if (!c) continue;
    let inb, cp;
    (await c.pc.getStats()).forEach(s => {
      if (s.type === 'inbound-rtp' && s.kind === 'video') inb = s;
      if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') cp = s;
    });
    if (!inb) continue;
    const s = { t, wall: Date.now(), fd: inb.framesDecoded, lost: inb.packetsLost, bytes: inb.bytesReceived,
                jbd: inb.jitterBufferDelay, jbe: inb.jitterBufferEmittedCount, frz: inb.freezeCount || 0,
                rtt: cp ? cp.currentRoundTripTime : null, w: inb.frameWidth, h: inb.frameHeight };
    const p = c.samples[c.samples.length - 1];
    c.samples.push(s);
    if (!p) continue;
    const dt = s.t - p.t;
    const fps = (s.fd - p.fd) / dt;
    const kbps = (s.bytes - p.bytes) * 8 / dt / 1000;
    const jb = (s.jbe - p.jbe) > 0 ? (s.jbd - p.jbd) / (s.jbe - p.jbe) * 1000 : 0;
    const rttMs = s.rtt != null ? s.rtt * 1000 : null;
    const hud = document.getElementById('h_' + cam);
    hud.textContent = `${cam} ${s.w}x${s.h} ${fps.toFixed(1)}fps ${kbps.toFixed(0)}kbps ` +
                      `jb${jb.toFixed(0)} rtt${rttMs != null ? rttMs.toFixed(0) : '-'} lost${s.lost} frz${s.frz}`;
    hud.className = 'hud' + ((rttMs != null && rttMs > 300) || fps < 3 ? ' warn' : '');
    if (cam === 'zed_front') {
      const badNow = (s.rtt != null && s.rtt > 2) || s.fd === p.fd;
      run.bad = badNow ? run.bad + 1 : 0;
      if (run.bad >= 6) {
        stop();
        setStatus(`AUTO-CUTOFF ${new Date().toLocaleTimeString()} — link clogged, streams closed. Reconnect when ready.`, true);
        document.title = 'CUTOFF — Marvin cameras';
      }
    }
  }
}

async function start() {
  stop();
  document.title = 'Marvin cameras';
  const host = document.getElementById('host').value.trim();
  const me = run = { t0: performance.now(), started: new Date().toISOString(), host, cams: {}, bad: 0 };
  run.timer = setInterval(sample, 1000);
  try {
    for (const cam of CAMS) {
      setStatus(`connecting ${cam}…`);
      const c = await connectCam(host, cam);
      // Cut off (or Reconnect pressed) while this camera was connecting: don't keep going.
      if (me.stopped) { c.pc.close(); return; }
      me.cams[cam] = c;
      if (cam !== CAMS[CAMS.length - 1]) await new Promise(r => setTimeout(r, 4000));
      if (me.stopped) return;
    }
    setStatus(`connected ${new Date().toLocaleTimeString()}`);
  } catch (e) {
    if (!me.stopped) setStatus(String(e.message || e), true);
  }
}

// Served from the Jetson: talk to whichever host served the page.
if (location.protocol.startsWith('http')) document.getElementById('host').value = location.hostname;
if (location.protocol === 'file:') setStatus('Opened as a file — use http://100.93.121.3:8090/ instead (MediaMTX rejects file:// pages)', true);
document.getElementById('connect').onclick = start;
document.getElementById('save').onclick = () => {
  if (!run) return;
  const data = { started: run.started, host: run.host,
                 cams: Object.fromEntries(Object.entries(run.cams).map(([k, v]) => [k, v.samples])) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = `marvin_video_stats_${run.started.replace(/[:.]/g, '-')}.json`;
  a.click();
};
if (location.protocol !== 'file:') start();

// Glass-to-glass clock: seconds.milliseconds of the PC wall clock, redrawn every frame.
if (new URLSearchParams(location.search).get('clock') === '1') {
  const el = document.getElementById('g2g');
  el.style.display = 'block';
  const tick = () => {
    const ms = Date.now() % 100000;  // SS.mmm with two digits of tens-of-seconds
    el.textContent = (ms / 1000).toFixed(3).padStart(6, '0');
    requestAnimationFrame(tick);
  };
  tick();
}
</script>
</body>
</html>
